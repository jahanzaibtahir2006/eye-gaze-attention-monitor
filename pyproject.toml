[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eye-gaze-attention-monitor"
version = "1.0.0"
description = "Real-time webcam eye-gaze attention monitor: three chained neural networks on an NVIDIA GPU."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10",
]

[project.optional-dependencies]
# NVIDIA GPU. Pinned for Pascal (GTX 10-series) support; see requirements.txt
gpu = ["onnxruntime-gpu[cuda,cudnn]==1.24.4", "nvidia-cudnn-cu12==9.10.2.21"]
cpu = ["onnxruntime>=1.20"]
phone = ["av>=12"]
export = ["torch", "onnx", "qai-hub-models[eyegaze,face-det-lite,facemap-3dmm]"]
dev = ["pytest>=8"]

[project.scripts]
gaze-monitor = "gaze_monitor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
